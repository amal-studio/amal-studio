Title="Amal Studio Pro licence"
Features="<b>Free forever</b>: streaming and recording, Quran, hadiths, live programme, basic overlays and ready themes, assistants, phone camera, several speakers, waiting screen.<br><b>Pro</b>: multistreaming, event frames and side panel, religious event backgrounds, video intros, slow-motion replay and Pro transitions."
