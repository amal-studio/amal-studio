Mic.Title="Assistant micro"
Mic.Type="Quel micro utilisez-vous ?"
Mic.Type.Usb="Micro USB branché à l'ordinateur"
Mic.Type.Lavalier="Micro-cravate filaire (jack) branché à l'ordinateur"
Mic.Type.Wireless="Micro sans fil (récepteur branché à l'ordinateur)"
Mic.Type.Xlr="Micro XLR avec carte son (interface audio)"
Mic.Type.Desk="Sono de la salle ou table de mixage"
Mic.Type.BuiltIn="Micro intégré (ordinateur portable, webcam)"
Mic.Type.Phone="Micro branché au téléphone (caméra téléphone)"
Mic.Type.Bluetooth="Casque ou écouteurs Bluetooth (déconseillé)"
Mic.Help.Usb="Branchez le micro directement sur un port USB de l'ordinateur (évitez les rallonges et les hubs). Windows l'installe tout seul. Choisissez-le ci-dessous : il s'appelle souvent du nom de sa marque."
Mic.Help.Lavalier="Les ordinateurs portables récents ont une seule prise jack « casque-micro » : il faut un micro-cravate à 4 pôles (3 anneaux sur la fiche, appelée TRRS) ou un adaptateur « séparateur casque/micro ». Avec un micro à 3 pôles (TRS), utilisez une petite carte son USB (peu coûteuse), plus fiable. Placez le micro à 15-20 cm de la bouche, sur la poitrine."
Mic.Help.Wireless="Kits sans fil (type Boya, Rode Wireless, DJI Mic, Hollyland…) : branchez le récepteur sur l'ordinateur par USB-C (il apparaît comme un micro USB) ou par son câble jack vers une carte son USB. Chargez l'émetteur et le récepteur avant le direct, et gardez-les à moins de 20 mètres sans mur entre eux."
Mic.Help.Xlr="Branchez le micro (câble XLR) sur l'entrée 1 de la carte son (Focusrite, Behringer, Maono…), elle-même en USB sur l'ordinateur. Micro statique (condensateur) : activez l'alimentation fantôme 48 V. Réglez le bouton de gain : en parlant fort, le voyant doit rester vert, jamais rouge. L'assistant met le son au centre (mono), sinon il ne sortirait que d'un côté."
Mic.Help.Desk="Demandez au sonorisateur une sortie de la table de mixage (REC OUT, AUX ou sortie ligne). Reliez-la à l'entrée ligne d'une carte son USB (pas à l'entrée micro : le son saturerait). Le son de la salle (micros des intervenants, questions du public) arrive ainsi déjà mélangé. Pas de réduction de bruit forte : la table a déjà ses réglages."
Mic.Help.BuiltIn="Le micro intégré capte aussi le clavier, le ventilateur et l'écho de la salle : à utiliser seulement en dépannage. Rapprochez l'ordinateur de la personne qui parle (moins d'un mètre). L'assistant ajoute une réduction de bruit et relève un peu le niveau."
Mic.Help.Phone="Le son vient du téléphone (application Larix). Selon le téléphone :\n• Prise jack : micro-cravate à 4 pôles (TRRS), ou micro à 3 pôles avec adaptateur TRRS.\n• USB-C (Android, iPhone 15 et suivants) : micro USB-C, ou adaptateur USB-C vers jack qui accepte les micros (pas tous).\n• Lightning (anciens iPhone) : adaptateur Lightning vers jack d'Apple, ou micro Lightning.\n• Micro sans fil : récepteur avec câble ou fiche pour téléphone.\nBranchez le micro AVANT d'ouvrir Larix. Dans Larix, vérifiez que le son n'est pas coupé (icône micro barrée) et regardez le niveau audio. Puis choisissez ci-dessous la source « Amal · Téléphone » : le vumètre doit bouger quand on parle dans le micro."
Mic.Help.Bluetooth="Le Bluetooth ajoute un décalage entre l'image et le son et réduit beaucoup la qualité du micro dès qu'on l'utilise. Préférez un micro filaire ou un kit sans fil dédié. En dépannage seulement."
