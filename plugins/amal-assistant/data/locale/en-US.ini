Mic.Help.Usb="Plug the microphone directly into a USB port of the computer (avoid extensions and hubs). Windows installs it automatically. Choose it below: it is often named after its brand."
Mic.Help.Lavalier="Recent laptops have a single headset jack: you need a 4-pole lavalier (3 rings on the plug, called TRRS) or a headset/mic splitter. With a 3-pole (TRS) microphone, use a small USB sound card, more reliable. Place the microphone 15-20 cm from the mouth, on the chest."
Mic.Help.Wireless="Wireless kits (Boya, Rode Wireless, DJI Mic, Hollyland…): plug the receiver into the computer via USB-C (it shows up as a USB microphone) or via its jack cable into a USB sound card. Charge transmitter and receiver before the live, and keep them within 20 metres with no wall in between."
Mic.Help.Xlr="Plug the microphone (XLR cable) into input 1 of the audio interface (Focusrite, Behringer, Maono…), connected by USB to the computer. Condenser microphone: turn on 48 V phantom power. Set the gain knob: when speaking loudly, the light must stay green, never red. The assistant centres the sound (mono), otherwise it would come out of one side only."
Mic.Help.Desk="Ask the sound engineer for an output of the mixing desk (REC OUT, AUX or line out). Connect it to the line input of a USB sound card (not the mic input: the sound would distort). The hall sound (speakers' microphones, audience questions) then arrives already mixed. No strong noise reduction: the desk already has its settings."
Mic.Help.BuiltIn="The built-in microphone also picks up the keyboard, fan and hall echo: use it only as a fallback. Bring the computer close to the speaker (less than a metre). The assistant adds noise reduction and raises the level a little."
Mic.Help.Phone="The sound comes from the phone (Larix app). Depending on the phone:\n• Jack socket: 4-pole (TRRS) lavalier, or 3-pole microphone with a TRRS adapter.\n• USB-C (Android, iPhone 15 and later): USB-C microphone, or a USB-C to jack adapter that accepts microphones (not all do).\n• Lightning (older iPhones): Apple Lightning to jack adapter, or a Lightning microphone.\n• Wireless microphone: receiver with a phone cable or plug.\nPlug the microphone in BEFORE opening Larix. In Larix, check that sound is not muted (crossed-out mic icon) and watch the audio level. Then choose the “Amal · Phone” source below: the meter must move when someone speaks into the microphone."
Mic.Help.Bluetooth="Bluetooth adds a delay between picture and sound and greatly reduces microphone quality while in use. Prefer a wired microphone or a dedicated wireless kit. Fallback only."
