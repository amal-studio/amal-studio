Dock.Title="Multistream"
Intro="Stream the same live to several platforms at once. The main platform is set in Settings > Stream; add the others here. Checked destinations start and stop with “Start Streaming”."
Tips="Tips: each extra platform uses as much upload bandwidth as the main one (e.g. 3 platforms at 2,500 kb/s = 7,500 kb/s upload). Run a speed test first. Set the keyframe interval to 2 s (Settings > Output), required by Facebook and YouTube. Stream keys stay on this computer."
