Help.youtube="Key: YouTube Studio > Create > Go live > Stream tab > “Stream key”. The server is already filled in."
Help.facebook="Key: Facebook > Live video (Live Producer) > “Use stream key”. The server is already filled in."
Help.twitch="Key: Creator Dashboard > Settings > Stream > “Primary Stream key”. The server is already filled in."
Help.tiktok="TikTok gives the server and key only to some accounts (per their terms). If your account has access, paste here the “Server URL” and “Stream key” given by TikTok, for each new live."
Help.instagram="Instagram gives the URL and key on instagram.com (Live > streaming software), for each new live. Paste them here."
Help.autre="Paste the server address (rtmp:// or rtmps://) and key given by the platform."
