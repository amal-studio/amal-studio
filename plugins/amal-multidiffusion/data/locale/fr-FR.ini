Dock.Title="Multidiffusion"
Intro="Diffusez le même direct sur plusieurs plateformes à la fois. La plateforme principale se règle dans Paramètres > Stream ; ajoutez ici les autres. Les destinations cochées démarrent et s'arrêtent avec « Commencer le streaming »."
Tips="Conseils : chaque plateforme en plus utilise autant de débit Internet que la principale (par exemple 3 plateformes à 2 500 kb/s = 7 500 kb/s en envoi). Faites un test de débit avant. Réglez l'intervalle d'images clés à 2 s (Paramètres > Sortie), exigé par Facebook et YouTube. Les clés de stream restent sur cet ordinateur."
