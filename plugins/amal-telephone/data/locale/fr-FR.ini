Steps="<b>Sur le téléphone :</b><br>1. Installez l'application gratuite <b>Larix Broadcaster</b> (Play Store ou App Store).<br>2. Branchez votre micro au téléphone.<br>3. Scannez ce QR code avec l'appareil photo : Larix s'ouvre et ajoute la connexion « Amal Studio ». Sinon, dans Larix, ajoutez une connexion avec l'adresse ci-dessus (mode SRT « Caller »).<br>4. Appuyez sur le bouton rouge de Larix.<br><b>Le PC et le téléphone doivent être sur le même Wi-Fi</b> (ou le PC connecté au partage de connexion du téléphone)."
