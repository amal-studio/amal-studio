Steps="<b>On the phone:</b><br>1. Install the free <b>Larix Broadcaster</b> app (Play Store or App Store).<br>2. Plug your microphone into the phone.<br>3. Scan this QR code with the camera: Larix opens and adds the \"Amal Studio\" connection. Otherwise, add a connection in Larix with the address above (SRT \"Caller\" mode).<br>4. Press Larix's red button.<br><b>The PC and the phone must be on the same Wi-Fi</b> (or the PC on the phone's hotspot)."
